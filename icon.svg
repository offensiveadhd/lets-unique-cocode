<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="cocode">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2b1a52"/>
      <stop offset="1" stop-color="#120b1f"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e3ccff"/>
      <stop offset=".45" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#5a2fb0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c49bff"/>
      <stop offset="1" stop-color="#ff8fe0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ghost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#5a44a0" stroke-opacity=".6" stroke-width="1.5"/>
  <!-- the brackets: a window of code -->
  <g filter="url(#glow)" fill="none" stroke="url(#ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 18 L11 32 L20 46"/>
    <path d="M44 18 L53 32 L44 46"/>
  </g>
  <!-- two lines the human wrote -->
  <g stroke="#ece6ff" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round">
    <path d="M25 24 H35"/>
    <path d="M27 31 H39"/>
  </g>
  <!-- the ghost line: dim, blurred, cyan -->
  <g filter="url(#ghost)" stroke="#6bf0ff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round">
    <path d="M27 38 H33"/>
  </g>
  <!-- Doto, at the caret -->
  <g filter="url(#glow)">
    <circle cx="38.5" cy="38.5" r="5.2" fill="url(#orb)"/>
  </g>
  <circle cx="36.9" cy="36.7" r="1.3" fill="#fff" fill-opacity=".75"/>
  <circle cx="36.7" cy="39" r=".85" fill="#120b1f"/>
  <circle cx="40.3" cy="39" r=".85" fill="#120b1f"/>
</svg>
