 repeatCount="indefinite" values="978 184;978 184;342 184;342 184;978 184;978 184" keyTimes="0;.65;.7292;.7458;.7475;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6417;.65;.7333;.7417;1"/></g><g opacity="0" transform="translate(342 104)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="342 104;342 104;978 104;978 104;342 104;342 104" keyTimes="0;.8083;.8875;.9042;.9058;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8;.8083;.8917;.9;1"/></g>
<g opacity="1"><text x="40" y="300" font-size="22">You type. Each settled change goes up with the text and the caret.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1458;.1583;.9833;.9958;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude offers the next lines as a ghost. Tab accepts it.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1583;.1708;.3042;.3167;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude prepares the real program ahead, in the Build pane.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3167;.3292;.4625;.475;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Run, on a program the window cannot run here: the run goes up to Claude.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.475;.4875;.6208;.6333;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude runs it with the <tspan class="m">run</tspan> tool and the output streams into the window.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6333;.6458;.7792;.7917;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Send to Claude: your code arrives as a question, a task or a note.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7917;.8042;.9583;.9708;1"/></g>
