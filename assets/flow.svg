<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="cf-t cf-d">
<title id="cf-t">How Claude drives cocode</title>
<desc id="cf-d">The cocode editor on the left, Claude on the right, two lanes between them. cocode.changed goes up each time your text settles. cocode.suggest comes down with the next lines as a ghost, and cocode.build comes down with the real program, prepared ahead. cocode.run goes up when the window cannot run the program itself. cocode.output comes down as Claude runs it with the run tool and streams the output. cocode.export goes up when you press Send to Claude. The session block names cocode.export as the export, cocode.snapshot as the snapshot and cocode.load as the restore.</desc>
