ight="36" rx="10" fill="#332055" stroke="#a66bff" stroke-width="2.5"/><text class="c m" x="1151" y="189">run</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6333;.6433;.7275;.7375;1"/></g><g opacity="0"><text class="c gr" x="1110" y="237" font-weight="600">answers in the chat</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8875;.9042;.9542;.9708;1"/></g>
