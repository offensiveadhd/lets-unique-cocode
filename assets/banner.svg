<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="cb-t cb-d">
<title id="cb-t">cocode</title>
<desc id="cb-d">cocode: talk in code. In an editor two lines are typed with Doto, a violet orb, riding the caret, and a cyan reach diamond appears in the gutter. A dim cyan ghost line is predicted, Tab turns it solid, the Build and run wheel spins to a green tick, and the next ghost line appears.</desc>
<style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,monospace}</style>
